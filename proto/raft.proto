syntax = "proto3";

package strata.raft;

option go_package = "github.com/HridhayP/strata/proto/raftpb";

// Entry is one slot of the replicated log.
message Entry {
  uint64 term = 1;
  uint64 index = 2;
  bytes data = 3;
}

message RequestVoteRequest {
  string group = 1; // routing key when one process hosts several Raft groups
  uint64 term = 2;
  int32 candidate_id = 3;
  uint64 last_log_index = 4;
  uint64 last_log_term = 5;
  // pre_vote asks "would you vote for me?" without disturbing the cluster.
  bool pre_vote = 6;
}

message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

message AppendEntriesRequest {
  string group = 1;
  uint64 term = 2;
  int32 leader_id = 3;
  uint64 prev_log_index = 4;
  uint64 prev_log_term = 5;
  repeated Entry entries = 6;
  uint64 leader_commit = 7;
  // read_ctx lets the leader confirm leadership for a batch of ReadIndex reads.
  uint64 read_ctx = 8;
  // read_probe marks a request that only confirms leadership for read_ctx.
  // The follower checks the term and replies at once, without touching its
  // log or waiting on an fsync, so reads never queue behind replication.
  bool read_probe = 9;
}

message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  // match_index is the follower's last index known to equal the leader's log.
  uint64 match_index = 3;
  // Fast backtracking hints for a rejected request.
  uint64 conflict_index = 4;
  uint64 conflict_term = 5;
  uint64 read_ctx = 6;
}

message InstallSnapshotRequest {
  string group = 1;
  uint64 term = 2;
  int32 leader_id = 3;
  uint64 last_included_index = 4;
  uint64 last_included_term = 5;
  bytes data = 6;
}

message InstallSnapshotResponse {
  uint64 term = 1;
}

// HardState is the part of Raft state that must survive restarts.
message HardState {
  uint64 term = 1;
  int32 voted_for = 2; // -1 when no vote was cast this term
}

// Compaction records that the log prefix up to index has been discarded.
message Compaction {
  uint64 index = 1;
  uint64 term = 2;
}

service Raft {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  rpc InstallSnapshot(InstallSnapshotRequest) returns (InstallSnapshotResponse);
}
