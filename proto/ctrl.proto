syntax = "proto3";

package strata.ctrl;

option go_package = "github.com/HridhayP/strata/proto/ctrlpb";

message Servers {
  repeated int32 ids = 1;
}

// Config is one numbered assignment of shards to replica groups.
message Config {
  uint64 num = 1;
  repeated int64 shards = 2; // shard index -> group ID (0 = unassigned)
  map<int64, Servers> groups = 3;
  // pinned records shards moved explicitly with Move; the ring does not
  // reassign them while their group exists.
  map<int32, int64> pinned = 4;
}

enum Op {
  QUERY = 0;
  JOIN = 1;
  LEAVE = 2;
  MOVE = 3;
}

enum Err {
  OK = 0;
  WRONG_LEADER = 1;
  TIMEOUT = 2;
}

message Request {
  Op op = 1;
  map<int64, Servers> join = 2;
  repeated int64 leave = 3;
  int32 shard = 4;
  int64 gid = 5;
  int64 num = 6; // QUERY: config number, or -1 / beyond latest for the latest
  uint64 client_id = 7;
  uint64 seq = 8;
}

message Response {
  Err err = 1;
  Config config = 2;
  int32 leader_hint = 3;
}

service Controller {
  rpc Do(Request) returns (Response);
}
