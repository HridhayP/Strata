# 5-node Strata cluster (one Raft group serving every shard) plus Prometheus.
#
#   docker compose up -d --build
#   docker compose run --rm bench          # 90/10 load from inside the network
#   open http://localhost:9090             # Prometheus
# One service builds the image; the rest reuse it (building it five times in
# parallel would race on the same tag).
x-node: &node
  image: strata:latest
  pull_policy: never
  restart: unless-stopped

services:
  strata1:
    <<: *node
    build: .
    command: ["-id", "1", "-nodes", "1=strata1:7000,2=strata2:7000,3=strata3:7000,4=strata4:7000,5=strata5:7000", "-groups", "1=1,2,3,4,5", "-data", "/data", "-metrics", ":9100"]
    volumes: ["data1:/data"]
    ports: ["7001:7000"]
  strata2:
    <<: *node
    command: ["-id", "2", "-nodes", "1=strata1:7000,2=strata2:7000,3=strata3:7000,4=strata4:7000,5=strata5:7000", "-groups", "1=1,2,3,4,5", "-data", "/data", "-metrics", ":9100"]
    volumes: ["data2:/data"]
    ports: ["7002:7000"]
  strata3:
    <<: *node
    command: ["-id", "3", "-nodes", "1=strata1:7000,2=strata2:7000,3=strata3:7000,4=strata4:7000,5=strata5:7000", "-groups", "1=1,2,3,4,5", "-data", "/data", "-metrics", ":9100"]
    volumes: ["data3:/data"]
    ports: ["7003:7000"]
  strata4:
    <<: *node
    command: ["-id", "4", "-nodes", "1=strata1:7000,2=strata2:7000,3=strata3:7000,4=strata4:7000,5=strata5:7000", "-groups", "1=1,2,3,4,5", "-data", "/data", "-metrics", ":9100"]
    volumes: ["data4:/data"]
    ports: ["7004:7000"]
  strata5:
    <<: *node
    command: ["-id", "5", "-nodes", "1=strata1:7000,2=strata2:7000,3=strata3:7000,4=strata4:7000,5=strata5:7000", "-groups", "1=1,2,3,4,5", "-data", "/data", "-metrics", ":9100"]
    volumes: ["data5:/data"]
    ports: ["7005:7000"]

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes: ["./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    depends_on: [strata1, strata2, strata3, strata4, strata5]

  bench:
    image: strata:latest
    pull_policy: never
    profiles: ["bench"]
    entrypoint: ["/usr/local/bin/strata-bench"]
    command: ["-nodes", "1=strata1:7000,2=strata2:7000,3=strata3:7000,4=strata4:7000,5=strata5:7000", "-servers", "1,2,3,4,5", "-clients", "64", "-duration", "20s"]
    depends_on: [strata1, strata2, strata3, strata4, strata5]

volumes:
  data1:
  data2:
  data3:
  data4:
  data5:
