# 5-replica Strata StatefulSet. Pod strata-N runs node ID N+1 (taken from its
# hostname); peers find each other through the headless Service's stable DNS
# names. Each pod keeps its Raft log and LSM on its own PersistentVolume.
#
#   kubectl apply -f deploy/k8s/strata.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: strata
data:
  NODES: "1=strata-0.strata:7000,2=strata-1.strata:7000,3=strata-2.strata:7000,4=strata-3.strata:7000,5=strata-4.strata:7000"
  GROUPS: "1=1,2,3,4,5"
---
apiVersion: v1
kind: Service
metadata:
  name: strata
  labels: {app: strata}
spec:
  clusterIP: None # headless: one DNS record per pod
  publishNotReadyAddresses: true # peers must reach each other before electing
  selector: {app: strata}
  ports:
    - {name: grpc, port: 7000}
    - {name: metrics, port: 9100}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: strata
spec:
  serviceName: strata
  replicas: 5
  podManagementPolicy: Parallel # a Raft group needs a quorum up at once
  selector:
    matchLabels: {app: strata}
  template:
    metadata:
      labels: {app: strata}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: strata
          image: strata:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: strata}
          args:
            - -id-from-hostname
            - -nodes=$(NODES)
            - -groups=$(GROUPS)
            - -data=/data
            - -metrics=:9100
          ports:
            - {name: grpc, containerPort: 7000}
            - {name: metrics, containerPort: 9100}
          readinessProbe:
            httpGet: {path: /status, port: metrics}
            periodSeconds: 5
          resources:
            requests: {cpu: 500m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /data}
      securityContext:
        fsGroup: 65532
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 5Gi}
